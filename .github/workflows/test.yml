name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test suite
        # System binaries (hyprctl, systemd-inhibit, omarchy, gh) are stubbed
        # by the test suite in a throwaway runtime directory, so nothing mutates
        # the runner or requires a live Hyprland/Omarchy session.
        run: test/run
